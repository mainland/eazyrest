[tox]
envlist = py310,py311,py312,lint
isolated_build = true
skip_missing_interpreters = true

# Test environments install only the runtime dependencies and the test tools,
# so a runtime dependency that is missing from pyproject.toml fails the tests.
[testenv]
extras = test
commands =
    pytest -q

# The pre-commit hooks pin the versions of ruff, docformatter, and mypy, so
# a new release of one of those tools cannot change the result.
[testenv:lint]
skip_install = true
deps = pre-commit
commands =
    pre-commit run --all-files --show-diff-on-failure
