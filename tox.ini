[tox]
envlist = py310,py311,py312,lint
isolated_build = true
skip_missing_interpreters = true

# Test environments install only the runtime dependencies and the test tools,
# so a runtime dependency that is missing from pyproject.toml fails the tests.
[testenv]
extras = test
commands =
    pytest -q

[testenv:lint]
extras = dev
commands =
    python -m ruff check .
    python -m mypy src tests
