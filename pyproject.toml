[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eazyrest"
description = "Building blocks for easy REST API consumption"
readme = "README.md"
authors = [
    {name = "Geoffrey Mainland", email = "mainland@apeiron.net"},
]
dynamic = ["version"]
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["rest", "http", "api", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "certifi",
    "dateparser",
    "isodate",
    "python-dateutil",
    "pytimeparse2",
    "requests[socks]",
    "typing_extensions; python_version < '3.11'",
    "tzlocal"
]

[project.optional-dependencies]
dev = [
  "docformatter",
  "mypy",
  "pre-commit",
  "ruff",
  "types-dateparser",
  "types-python-dateutil",
  "types-requests",
  "types-urllib3"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eazyrest = ["py.typed"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "E501", # line too long
  "E",    # pycodestyle
  "F",    # Pyflakes
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "I",    # isort
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.docformatter]
in-place = true
recursive = true
wrap-summaries = 79
wrap-descriptions = 72
close-quotes-on-newline = true

[tool.mypy]
python_version = "3.10"
files = ["src"]
pretty = true
show_error_codes = true
warn_unused_configs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["isodate", "pytimeparse2"]
ignore_missing_imports = true
