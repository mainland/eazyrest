[build-system]
# setuptools 77 is the first release to accept a license expression.
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "eazyrest"
description = "Building blocks for easy REST API consumption"
readme = "README.md"
authors = [
    {name = "Geoffrey Mainland", email = "mainland@apeiron.net"},
]
dynamic = ["version"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rest", "http", "api", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
# Each minimum is a release that the min-deps tox environments test, not
# necessarily the first that works. requests 2.33.0 and urllib3 2.8.0 are the
# first releases without known vulnerabilities, and urllib3 2 is the first
# with HTTPResponse.read1(), which the response limits need. python-dateutil
# 2.9.0 is the first release that imports without a DeprecationWarning on
# Python 3.12, and typing_extensions 4.14.1 has Self.
dependencies = [
    "isodate>=0.7.2",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.33.0",
    "typing_extensions>=4.14.1; python_version < '3.11'",
    "urllib3>=2.8.0",
]

[project.urls]
Source = "https://github.com/mainland/eazyrest"
Issues = "https://github.com/mainland/eazyrest/issues"
Changelog = "https://github.com/mainland/eazyrest/blob/main/docs/changelog.md"

[project.optional-dependencies]
# Pydantic 2.12 is the first release that writes the undeclared keys of a
# TypedDict whose config allows them, and 2.14.1 the oldest tested release
# that installs on Python 3.15. eazyrest.pydantic uses Pydantic 2's API, which
# a later major version may change.
pydantic = [
  "pydantic>=2.12,<3; python_version < '3.15'",
  "pydantic>=2.14.1,<3; python_version >= '3.15'",
  "typing_extensions>=4.14.1",
]
socks = [
  "requests[socks]",
]

[dependency-groups]
test = [
  {include-group = "test-core"},
  "pydantic>=2.12,<3",
]
# The tests that do not need Pydantic, for the no-pydantic tox environment.
test-core = [
  "coverage",
  "hypothesis",
  # The packaging test reads the requirements in the package's metadata.
  "packaging",
  # pytest 9 is the first release that reads [tool.pytest].
  "pytest>=9",
  "requests-mock",
  # The tests use TypeAliasType on every Python version.
  "typing_extensions>=4.14.1",
]
docs = [
  "furo",
  "myst-parser",
  "pydantic>=2.12",
  "sphinx==9.1.0",
]
dev = [
  {include-group = "test"},
  {include-group = "docs"},
  "build",
  "mypy==2.4.1",
  "pre-commit==4.6.0",
  "ruff==0.16.10",
  "sp-repo-review[cli]==2026.8.14",
  "tox",
  "tox-uv",
  "twine",
  "types-python-dateutil",
  "types-requests",
  "zizmor==1.32.0",
]

# Sphinx 9.1 requires Python 3.12, so the docs group does, and so does the dev
# group, which includes it. The test environments still run every supported
# Python.
# Declare the dev group's requirement too. uv otherwise also resolves its tools
# for Python 3.10, through a release of filelock with known vulnerabilities
# that no supported environment installs.
[tool.uv.dependency-groups]
docs = {requires-python = ">=3.12"}
dev = {requires-python = ">=3.12"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eazyrest = ["py.typed"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = [
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "E501", # line too long
  "E",    # pycodestyle
  "F",    # Pyflakes
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "I",    # isort
  "C4",   # flake8-comprehensions
  "PT",   # flake8-pytest-style
  "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test docstrings do not document pytest fixtures, so D417, which wants every
# parameter, does not apply.
"tests/**" = ["D417"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
pretty = true

# isodate ships no type information.
[[tool.mypy.overrides]]
module = ["isodate"]
ignore_missing_imports = true

# The DRF recipe tests use Django, DRF, and django-filter, which only the drf
# tox environment installs, so their classes are untyped here.
[[tool.mypy.overrides]]
module = ["django.*", "rest_framework.*", "django_filters.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["test_drf_recipes"]
disallow_subclassing_any = false

[tool.pytest]
minversion = "9.0"
addopts = ["--strict-config", "--strict-markers", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source_pkgs = ["eazyrest"]

[tool.coverage.report]
show_missing = true

[tool.tox]
requires = [
  "tox>=4.22",
  "tox-uv>=1.20",
]
env_list = [
  "py310",
  "py311",
  "py312",
  "py313",
  "py314",
  "py315",
  "pydantic-min",
  "min-deps",
  "min-deps-py315",
  "no-pydantic",
  "drf",
  "lint",
  "docs",
]
skip_missing_interpreters = true

# Test environments install the package and the test group but not the lock, so
# a runtime dependency that is missing from pyproject.toml fails the tests.
[tool.tox.env_run_base]
dependency_groups = ["test"]
commands = [
  ["coverage", "run", "-m", "pytest", "-q"],
  ["coverage", "report"],
]

# Test against the oldest Pydantic release that the pydantic extra allows. It
# has no wheel for Python 3.15, so use the oldest supported Python.
[tool.tox.env.pydantic-min]
base_python = ["3.10"]
deps = ["pydantic==2.12.0"]

# Test against the minimum of every dependency that pyproject.toml declares, on
# the oldest Python and then the newest. The dependencies are installed first,
# so installing the package keeps these versions.
[tool.tox.env.min-deps]
base_python = ["3.10"]
deps = [
  "isodate==0.7.2",
  "python-dateutil==2.9.0.post0",
  "requests==2.33.0",
  "urllib3==2.8.0",
  "typing_extensions==4.14.1",
  "pydantic==2.12.0",
]

[tool.tox.env.min-deps-py315]
base_python = ["3.15"]
deps = [
  "isodate==0.7.2",
  "python-dateutil==2.9.0.post0",
  "requests==2.33.0",
  "urllib3==2.8.0",
  # Pydantic 2.14.1 needs typing_extensions 4.16.0.
  "typing_extensions==4.16.0",
  "pydantic==2.14.1",
]

# Test the server-side recipes in the Django REST Framework guide against
# Django, DRF, and django-filter. Other environments skip these tests.
[tool.tox.env.drf]
base_python = ["3.12"]
deps = ["django", "djangorestframework", "django-filter"]
commands = [["pytest", "-q", "tests/test_drf_recipes.py"]]

# Test the core without Pydantic, so that a dependency that only Pydantic
# brings in cannot hide a missing one. The Pydantic tests are skipped. The
# interpreter is fixed, so that the result does not depend on which Python tox
# finds first.
[tool.tox.env.no-pydantic]
base_python = ["3.12"]
dependency_groups = ["test-core"]
commands = [
  ["coverage", "run", "-m", "pytest", "-q", "--ignore=tests/test_pydantic.py"],
  [
    "python",
    "-c",
    "import importlib.util, sys; sys.exit(importlib.util.find_spec('pydantic') is not None)",
  ],
]

# The hooks run the checkers from .venv, at the versions that uv.lock pins, so
# the lint environment first brings .venv up to date.
[tool.tox.env.lint]
skip_install = true
allowlist_externals = ["uv", ".venv/bin/python"]
commands = [
  ["uv", "sync", "--locked", "--quiet"],
  [
    ".venv/bin/python",
    "-m",
    "pre_commit",
    "run",
    "--all-files",
    "--show-diff-on-failure",
  ],
]

[tool.tox.env.docs]
dependency_groups = ["docs"]
commands = [
  [
    "sphinx-build",
    "-W",
    "--keep-going",
    "-b",
    "html",
    "docs",
    "docs/_build/html",
  ],
]

# Link checking needs the network and fails when another site does, so it is
# not in env_list. Run it by hand.
[tool.tox.env.linkcheck]
dependency_groups = ["docs"]
commands = [
  [
    "sphinx-build",
    "-b",
    "linkcheck",
    "docs",
    "docs/_build/linkcheck",
  ],
]

[tool.rumdl]
flavor = "myst"

# Markdown prose is filled to 79 columns, the Python source's line length,
# and `rumdl fmt` refills it. Code blocks are not checked, and a line may run
# long only by a code span, which is never broken.
[tool.rumdl.MD013]
line-length = 79
code-blocks = false
code-spans = false
reflow = true
reflow-mode = "normalize"

# Deliberate departures from the Scientific Python Development Guide.
[tool.repo-review.ignore]
PC110 = "ruff format runs as a local hook from .venv."
PC140 = "mypy runs as a local hook from .venv."
PC190 = "ruff check runs as a local hook from .venv."
PC170 = "The repository has no reStructuredText files."
PC901 = "CI runs the hooks through tox, not pre-commit.ci."
PC902 = "CI runs the hooks through tox, not pre-commit.ci."
PC903 = "CI runs the hooks through tox, not pre-commit.ci."
SEC001 = "zizmor runs as a local hook from .venv."
