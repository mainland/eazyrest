[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eazyrest"
description = "Building blocks for easy REST API consumption"
readme = "README.md"
authors = [
    {name = "Geoffrey Mainland", email = "mainland@apeiron.net"},
]
dynamic = ["version"]
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["rest", "http", "api", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "certifi",
    "dateparser",
    "isodate",
    "python-dateutil",
    "pytimeparse2",
    "requests[socks]",
    "typing_extensions; python_version < '3.11'",
    "tzlocal"
]

[dependency-groups]
test = [
  "pytest",
  "requests-mock",
]
dev = [
  {include-group = "test"},
  "build",
  "docformatter[tomli]==1.7.8",
  "mypy==2.4.0",
  "pre-commit==4.6.0",
  "ruff==0.16.10",
  "twine",
  "types-dateparser",
  "types-python-dateutil",
  "types-requests",
  "types-urllib3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eazyrest = ["py.typed"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = [
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "E501", # line too long
  "E",    # pycodestyle
  "F",    # Pyflakes
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "I",    # isort
  "C4",   # flake8-comprehensions
  "PT",   # flake8-pytest-style
  "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test docstrings do not document pytest fixtures, so D417, which wants every
# parameter, does not apply.
"tests/**" = ["D417"]

[tool.docformatter]
in-place = true
recursive = true
wrap-summaries = 79
wrap-descriptions = 79
close-quotes-on-newline = true

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
pretty = true

# isodate and pytimeparse2 ship no type information.
[[tool.mypy.overrides]]
module = ["isodate", "pytimeparse2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["tests"]

[tool.rumdl]
flavor = "myst"
# The Markdown files keep each paragraph on one line.
disable = ["MD013"]
