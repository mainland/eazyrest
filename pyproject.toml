[build-system]
# setuptools 77 is the first release to accept a license expression.
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "eazyrest"
description = "Building blocks for easy REST API consumption"
readme = "README.md"
authors = [
    {name = "Geoffrey Mainland", email = "mainland@apeiron.net"},
]
dynamic = ["version"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rest", "http", "api", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "isodate",
    "python-dateutil",
    "requests",
    "typing_extensions; python_version < '3.11'",
    "urllib3",
]

[project.optional-dependencies]
socks = [
  "requests[socks]",
]

[dependency-groups]
test = [
  "coverage",
  "pytest",
  "requests-mock",
]
docs = [
  "furo",
  "myst-parser",
  "sphinx==9.1.0",
]
dev = [
  {include-group = "test"},
  {include-group = "docs"},
  "build",
  "docformatter[tomli]==1.7.8",
  "mypy==2.4.0",
  "pre-commit==4.6.0",
  "ruff==0.16.10",
  "sp-repo-review[cli]==2026.8.14",
  "tox",
  "tox-uv",
  "twine",
  "types-python-dateutil",
  "types-requests",
  "types-urllib3",
]

# Sphinx 9.1 requires Python 3.12, so the docs group does, and so does the dev
# group, which includes it. The test environments still run every supported
# Python.
[tool.uv.dependency-groups]
docs = {requires-python = ">=3.12"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eazyrest = ["py.typed"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = [
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "E501", # line too long
  "E",    # pycodestyle
  "F",    # Pyflakes
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "I",    # isort
  "C4",   # flake8-comprehensions
  "PT",   # flake8-pytest-style
  "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test docstrings do not document pytest fixtures, so D417, which wants every
# parameter, does not apply.
"tests/**" = ["D417"]

[tool.docformatter]
in-place = true
recursive = true
wrap-summaries = 79
wrap-descriptions = 79
close-quotes-on-newline = true

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
pretty = true

# isodate ships no type information.
[[tool.mypy.overrides]]
module = ["isodate"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source_pkgs = ["eazyrest"]

[tool.coverage.report]
show_missing = true

[tool.tox]
requires = [
  "tox>=4.22",
  "tox-uv>=1.20",
]
env_list = [
  "py310",
  "py311",
  "py312",
  "py313",
  "py314",
  "py315",
  "lint",
  "docs",
]
skip_missing_interpreters = true

# Test environments install the package and the test group but not the lock, so
# a runtime dependency that is missing from pyproject.toml fails the tests.
[tool.tox.env_run_base]
dependency_groups = ["test"]
commands = [
  ["coverage", "run", "-m", "pytest", "-q"],
  ["coverage", "report"],
]

# The hooks run the checkers from .venv, at the versions that uv.lock pins, so
# the lint environment first brings .venv up to date.
[tool.tox.env.lint]
skip_install = true
allowlist_externals = ["uv", ".venv/bin/python"]
commands = [
  ["uv", "sync", "--locked", "--quiet"],
  [
    ".venv/bin/python",
    "-m",
    "pre_commit",
    "run",
    "--all-files",
    "--show-diff-on-failure",
  ],
]

[tool.tox.env.docs]
dependency_groups = ["docs"]
commands = [
  [
    "sphinx-build",
    "-W",
    "--keep-going",
    "-b",
    "html",
    "docs",
    "docs/_build/html",
  ],
]

# Link checking needs the network and fails when another site does, so it is
# not in env_list. Run it by hand.
[tool.tox.env.linkcheck]
dependency_groups = ["docs"]
commands = [
  [
    "sphinx-build",
    "-b",
    "linkcheck",
    "docs",
    "docs/_build/linkcheck",
  ],
]

[tool.rumdl]
flavor = "myst"
# The Markdown files keep each paragraph on one line.
disable = ["MD013"]

# Deliberate departures from the Scientific Python Development Guide.
[tool.repo-review.ignore]
PC110 = "ruff format runs as a local hook from .venv."
PC140 = "mypy runs as a local hook from .venv."
PC190 = "ruff check runs as a local hook from .venv."
PC170 = "The repository has no reStructuredText files."
PC901 = "CI runs the hooks through tox, not pre-commit.ci."
PC902 = "CI runs the hooks through tox, not pre-commit.ci."
PC903 = "CI runs the hooks through tox, not pre-commit.ci."
SEC001 = "Actions are pinned by major version, and Dependabot updates them."
