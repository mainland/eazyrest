name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to a branch or pull request cancels its running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ["py310", "py311", "py312"]

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Run Tests
        run: uvx --with tox-uv tox -e ${{ matrix.env }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Check That uv.lock Is Current
        run: uv lock --check

      - name: Cache pre-commit Environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run Tox Lint Environment
        run: uvx --with tox-uv tox -e lint

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Audit Locked Dependencies
        run: |
          uv export --locked --all-groups --no-emit-project \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --require-hashes \
            --requirement "$RUNNER_TEMP/requirements.txt"
