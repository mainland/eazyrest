name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to a branch or pull request cancels its running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ["py310", "py311", "py312", "py313", "py314", "py315"]

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Run Tests
        run: uvx --with tox-uv tox -e ${{ matrix.env }}

  minimums:
    name: Test (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Pydantic, the minimum of every dependency on the oldest
        # and newest Python, and the core without Pydantic.
        env: ["pydantic-min", "min-deps", "min-deps-py315", "no-pydantic"]

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Run Tests
        run: uvx --with tox-uv tox -e ${{ matrix.env }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Check That uv.lock Is Current
        run: uv lock --check

      - name: Cache pre-commit Environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run Tox Lint Environment
        run: uvx --with tox-uv tox -e lint

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Audit Locked Dependencies
        run: |
          uv export --locked --all-groups --no-emit-project \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --require-hashes \
            --requirement "$RUNNER_TEMP/requirements.txt"

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Build Documentation
        run: uvx --with tox-uv tox -e docs

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Build Distributions
        run: |
          uv build
          uvx twine check --strict dist/eazyrest-*

      # The extras' dependencies have markers that differ between the oldest
      # and newest supported Python, so install each on both.
      - name: Import Wheel With Each Extra on the Oldest and Newest Python
        run: |
          wheel="$(ls dist/*.whl)"
          for python in 3.10 3.15; do
            for extra in core pydantic socks; do
              env="$RUNNER_TEMP/wheel-$python-$extra"
              uv venv --python "$python" "$env"
              if [ "$extra" = core ]; then
                VIRTUAL_ENV="$env" uv pip install "$wheel"
              else
                VIRTUAL_ENV="$env" uv pip install "$wheel[$extra]"
              fi
            done
          done
          cd "$RUNNER_TEMP"
          for python in 3.10 3.15; do
            "$RUNNER_TEMP/wheel-$python-core/bin/python" -c "import eazyrest"
            # The core installs without Pydantic.
            "$RUNNER_TEMP/wheel-$python-core/bin/python" -c \
              "import importlib.util, sys; sys.exit(importlib.util.find_spec('pydantic') is not None)"
            "$RUNNER_TEMP/wheel-$python-pydantic/bin/python" -c \
              "import eazyrest.pydantic"
            "$RUNNER_TEMP/wheel-$python-socks/bin/python" -c "import socks"
          done
